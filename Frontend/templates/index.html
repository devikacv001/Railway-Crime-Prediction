<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railway Safety Tool</title>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>&#128274; Vigil Rail </h1>
  </header>

  <div class="container main-container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-glass shadow-lg p-4">
          <div class="text-center mb-4">
            <h2 class="title">Welcome</h2>
            <p class="subtitle">Predict arrest trends &amp; send emergency alerts instantly.</p>
          </div>

          <div class="row g-3 mb-4 content">
            <div class="col-md-4">
              <label for="yearInput" class="form-label">Enter Year:</label>
              <input type="number" id="yearInput" class="form-control" placeholder="e.g., 2025">
            </div>
            <div class="col-md-4">
              <label for="stateSelect" class="form-label">Select State:</label>
              <select id="stateSelect" class="form-select">
                <option value="">ALL</option>
                {% for st in states %}
                <option value="{{ st }}">{{ st }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4 d-flex align-items-end justify-content-end">
              <button id="predictBtn" class="btn btn-primary me-2">📊 Predict</button>
              <button id="panicBtn" class="btn btn-danger">🆘 Panic Alert</button>
            </div>
          </div>

          <div class="d-flex justify-content-start mb-4 content">
            <button id="trendBtn" class="btn btn-success">📈 Show Trend</button>
          </div>

          <div id="result" class="alert d-none" role="alert"></div>
          <canvas id="trendChart" height="100"></canvas>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 Railway Safety Tool
  </footer>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS (inline) -->
  <script>
    const resultDiv = document.getElementById('result');
    const trendChartCtx = document.getElementById('trendChart').getContext('2d');
    let trendChart;

    async function postData(url = '', data = {}) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await response.json();
      if (!response.ok || json.status === 'error') throw new Error(json.message || 'Unknown error');
      return json;
    }

    document.getElementById('predictBtn').addEventListener('click', async () => {
      const year = document.getElementById('yearInput').value;
      const state = document.getElementById('stateSelect').value;
      if (!year) return showResult('Please enter a year.', 'warning');
      showResult('Predicting…', 'info');
      try {
        const data = await postData('/predict', { year, state });
        showResult(`Prediction for ${data.state} in ${data.year}: ${data.prediction}`, 'success');
      } catch (err) {
        showResult(err.message, 'danger');
      }
    });

    document.getElementById('panicBtn').addEventListener('click', async () => {
      showResult('Sending emergency alert…', 'info');
      try {
        const data = await postData('/panic', {});
        showResult(data.message, 'success');
      } catch (err) {
        showResult(err.message, 'danger');
      }
    });

    document.getElementById('trendBtn').addEventListener('click', async () => {
      const state = document.getElementById('stateSelect').value;
      showResult('Loading trend…', 'info');
      try {
        const data = await postData('/trend', { state });
        renderChart(data.trend);
        showResult(`Trend for ${data.state}`, 'success');
      } catch (err) {
        showResult(err.message, 'danger');
      }
    });

    function showResult(message, type) {
      resultDiv.textContent = message;
      resultDiv.className = `alert alert-${type}`;
      resultDiv.classList.remove('d-none');
    }

    function renderChart(trendData) {
      const labels = Object.keys(trendData);
      const values = Object.values(trendData);
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(trendChartCtx, {
        type: 'line',
        data: { labels, datasets: [{ label: 'Arrests', data: values, fill: false, tension: 0.1 }] },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }
  </script>
</body>
</html>
